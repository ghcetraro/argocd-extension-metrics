apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-metrics-server
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: argocd-metrics-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: argocd-metrics-server
    spec:
      containers:
        # Auth Prometheus (opcional): descomentar env y crear Secret desde secret.example.yaml
        - image: quay.io/argoprojlabs/argocd-extension-metrics:latest
          imagePullPolicy: IfNotPresent
          args:
            - '-enableTLS=false'
          name: argocd-metrics-server
          ports:
            - containerPort: 9003
              name: metrics
              protocol: TCP
          # env:
          #   - name: PROMETHEUS_USERNAME
          #     valueFrom:
          #       secretKeyRef:
          #         name: argocd-metrics-prometheus-auth
          #         key: username
          #   - name: PROMETHEUS_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: argocd-metrics-prometheus-auth
          #         key: password
          #   - name: PROMETHEUS_BEARER_TOKEN
          #     valueFrom:
          #       secretKeyRef:
          #         name: argocd-metrics-prometheus-auth
          #         key: bearer_token
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.json
              subPath: config.json
      volumes:
        - name: config-volume
          configMap:
            name: argocd-metrics-server-configmap
