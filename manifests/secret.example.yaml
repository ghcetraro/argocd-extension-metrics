# Ejemplo: no aplicar tal cual. Copiá a un Secret real o usá sealed-secrets / External Secrets.
# kubectl create secret generic argocd-metrics-prometheus-auth \
#   --from-literal=username='mi-usuario' \
#   --from-literal=password='mi-clave' \
#   -n <namespace-argocd>
apiVersion: v1
kind: Secret
metadata:
  name: argocd-metrics-prometheus-auth
type: Opaque
stringData:
  username: "CAMBIAR_USUARIO"
  password: "CAMBIAR_PASSWORD"
  # Alternativa bearer (usar en lugar de username/password):
  # bearer_token: "CAMBIAR_TOKEN"
